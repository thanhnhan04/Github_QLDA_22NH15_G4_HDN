{% extends 'core/base.html' %}
{% load static %}
{% block navbar %}
<style>
    .admin-navbar .nav-link {
        font-weight: 500;
        font-size: 1.1rem;
        padding: 0.75rem 1.5rem !important;
        border-radius: 30px;
        margin: 0 0.5rem;
        transition: background 0.2s, color 0.2s, font-weight 0.2s;
        text-align: center;
    }
    .admin-navbar .nav-link.active, .admin-navbar .nav-link[aria-current="page"] {
        background: var(--primary-yellow);
        color: var(--primary-red) !important;
        font-weight: 700;
        box-shadow: 0 2px 8px rgba(255, 160, 0, 0.15);
    }
    .admin-navbar .nav-link:not(.active):hover {
        background: var(--primary-orange);
        color: #fff !important;
    }
    .admin-navbar .navbar-nav {
        align-items: center;
    }
</style>
<nav class="navbar navbar-expand-lg navbar-dark admin-navbar">
    <div class="container">
        <!-- <span class="navbar-text me-4 fw-bold d-flex align-items-center" style="color:#fff; font-size:1.1rem;">
            <i class="fas fa-user-circle me-1"></i>
            Xin chào, {{ request.user.get_full_name|default:request.user.username }}
        </span> -->
        <a class="navbar-brand" href="{% url 'admin_home' %}">
            <i class="fas fa-user-shield me-2"></i> TASTY FOOD
            <!-- <span class="brand-subtitle d-none d-md-inline">Ngon - Nhanh - Sạch</span> -->
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'admin_home' %}active{% endif %}" href="{% url 'admin_home' %}"><i class="fas fa-home me-1"></i> Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'admin_order_list' %}active{% endif %}" href="{% url 'admin_order_list' %}"><i class="fas fa-clipboard-list me-1"></i> Quản lý đơn hàng</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'admin_products' %}active{% endif %}" href="{% url 'admin_products' %}"><i class="fas fa-boxes me-1"></i> Quản lý sản phẩm</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'admin_customers' %}active{% endif %}" href="{% url 'admin_customers' %}"><i class="fas fa-users me-1"></i> Quản lý khách hàng</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled" href="#"><i class="fas fa-chart-bar me-1"></i> Thống kê</a>
                </li>
            </ul>
            <ul class="navbar-nav align-items-center">
                <li class="nav-item me-2">
                    <!-- <span class="nav-link disabled" style="font-weight:600; color:#fff; opacity:1;">
                        <i class="fas fa-user-circle me-1"></i>
                        Xin chào, {{ request.user.get_full_name|default:request.user.username }}
                    </span> -->
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled" href="#"><i class="fas fa-user me-1"></i> Hồ sơ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'logout' %}"><i class="fas fa-sign-out-alt me-1"></i> Đăng xuất</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
{% endblock %}

{% block content %}
    {% block admin_content %}{% endblock %}
{% endblock %}
