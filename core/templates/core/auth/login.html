{% extends 'core/base_customer.html' %}
{% block title %}Đăng Nhập{% endblock %}
{% block content %}
<div class="login-bg-effect position-fixed top-0 start-0 w-100 h-100" style="z-index:0;"></div>
<div class="container py-5 d-flex justify-content-center align-items-center position-relative" style="min-height: 95vh; z-index:2;">
  <div class="login-register-card d-flex flex-column flex-md-row shadow-lg rounded-5 overflow-hidden" style="max-width: 1100px; width: 100%; background: #fff; min-height: 520px;">
    <!-- Login side -->
    <div class="login-form-side p-5 d-flex flex-column justify-content-center align-items-center flex-fill" style="background: var(--primary-red,#FF3D00); min-width: 440px;">
      <h2 class="fw-bold mb-4 text-center" style="color: #fff; letter-spacing: 1px; font-size:2.5rem;">LOGIN</h2>
      <form method="post" class="w-100" style="max-width: 380px;">
        {% csrf_token %}
        <div class="mb-3">
          <input type="text" class="form-control form-control-lg rounded-pill px-4 login-input" name="username" placeholder="Username" required>
        </div>
        <div class="mb-4">
          <input type="password" class="form-control form-control-lg rounded-pill px-4 login-input" name="password" placeholder="Password" required>
        </div>
        <div class="d-grid mb-2">
          <button type="submit" class="btn btn-lg rounded-pill fw-bold login-btn" style="background: linear-gradient(90deg, var(--primary-yellow), var(--primary-orange)); color: #222; font-size:1.3rem;">Login</button>
        </div>
      </form>
    </div>
    <!-- Register side -->
    <div class="register-side d-flex flex-column justify-content-center align-items-center flex-fill text-white text-center p-5" style="background: linear-gradient(135deg, #FF3D00 0%, #FFA000 100%); min-width: 440px;">
      <h2 class="fw-bold mb-2" style="text-shadow: 0 2px 8px rgba(0,0,0,0.12); font-size:2.3rem; color: #fff;">Start your<br>journey now</h2>
      <p class="mb-4" style="color: #fffbe7; text-shadow: 0 1px 4px rgba(0,0,0,0.10); font-size:1.15rem;">Nếu bạn chưa có tài khoản, hãy đăng ký để bắt đầu trải nghiệm.</p>
      <a href="{% url 'register' %}" class="btn btn-outline-light btn-lg rounded-pill px-5 fw-bold register-btn" style="border: 2px solid #fff; color: #fff; font-size:1.15rem;">Register</a>
    </div>
  </div>
</div>
<style>
  .login-bg-effect {
    pointer-events: none;
    background: linear-gradient(120deg, #fffbe7 0%, #fff3e0 100%);
    overflow: hidden;
    z-index: 0 !important;
  }
  /* Blob animation */
  .login-bg-effect .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
    animation: blobMove 16s infinite alternate;
    pointer-events: none;
  }
  .login-bg-effect .blob1 {
    width: 600px; height: 600px;
    left: 2vw; top: 8vh;
    background: radial-gradient(circle at 30% 30%, #FF9800 0%, #FFE082 80%);
    animation-delay: 0s;
  }
  .login-bg-effect .blob2 {
    width: 400px; height: 400px;
    right: 8vw; top: 18vh;
    background: radial-gradient(circle at 70% 30%, #FFA000 0%, #FFFDE7 80%);
    animation-delay: 3s;
  }
  .login-bg-effect .blob3 {
    width: 350px; height: 350px;
    left: 20vw; bottom: 6vh;
    background: radial-gradient(circle at 50% 70%, #FF3D00 0%, #FFB300 80%);
    animation-delay: 6s;
  }
  .login-bg-effect .blob4 {
    width: 300px; height: 300px;
    right: 18vw; bottom: 10vh;
    background: radial-gradient(circle at 60% 60%, #FFA000 0%, #FFF8E1 80%);
    animation-delay: 9s;
  }
  @keyframes blobMove {
    0% { transform: scale(1) translateY(0) translateX(0); }
    100% { transform: scale(1.18) translateY(40px) translateX(60px); }
  }
  .navbar {
    z-index: 10 !important;
    position: relative;
  }
  .login-register-card {
    z-index: 2;
    box-shadow: 0 20px 80px rgba(255,61,0,0.18);
    border-radius: 3rem;
    background: #fff;
  }
  .login-form-side {
    min-width: 440px;
    background: var(--primary-red,#FF3D00);
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .login-form-side h2, .login-form-side label {
    color: #fff !important;
  }
  .login-input {
    background: #fff3e0;
    color: #222;
    border: none;
    box-shadow: 0 2px 8px rgba(255,61,0,0.08);
  }
  .login-input:focus {
    background: #fffbe7;
    border: 2px solid var(--primary-yellow);
    outline: none;
    box-shadow: 0 2px 8px rgba(255,193,7,0.12);
  }
  .login-btn {
    background: linear-gradient(90deg, var(--primary-yellow), var(--primary-orange));
    color: #222;
    border: none;
    box-shadow: 0 2px 8px rgba(255,160,0,0.10);
    transition: all 0.2s;
  }
  .login-btn:hover {
    background: linear-gradient(90deg, var(--primary-orange), var(--primary-yellow));
    color: #fff;
    transform: translateY(-2px);
  }
  .register-side {
    min-width: 440px;
    background: linear-gradient(135deg, #FF3D00 0%, #FFA000 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .register-side h2, .register-side p {
    color: #fff !important;
  }
  .register-btn {
    border: 2px solid #fff;
    color: #fff;
    background: transparent;
    transition: all 0.2s;
  }
  .register-btn:hover {
    background: #fff;
    color: #FF3D00;
    border-color: #fff;
    transform: translateY(-2px);
  }
  @media (max-width: 991px) {
    .login-register-card { flex-direction: column !important; min-width: 100% !important; }
    .login-form-side, .register-side { min-width: 100% !important; padding: 2rem 1rem !important; }
  }
</style>
<!-- Blobs for animated background -->
<div class="login-bg-effect position-fixed top-0 start-0 w-100 h-100" style="z-index:0; pointer-events:none;">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>
</div>
{% endblock %}
