{% extends 'core/base.html' %}

{% block title %}Thông Tin Cá Nhân{% endblock %}

{% block content %}
<div class="container-fluid py-5 hero-section mb-4">
    <div class="container">
        <h1 class="display-4 text-center mb-4 text-white">Thông Tin Cá Nhân</h1>
        <p class="lead text-center mb-0 text-white-50">Cập nhật thông tin tài khoản của bạn</p>
    </div>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg rounded-3 border-0">
                <div class="card-header bg-white border-0">
                    <h3 class="text-center mb-0" style="color: var(--primary-red);">Thông Tin Cá Nhân</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label">Tên đăng nhập</label>
                            <input type="text" class="form-control" id="username" value="{{ user.username }}" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" value="{{ user.email }}" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Số điện thoại</label>
                            <input type="tel" class="form-control" id="phone" name="phone" value="{{ user.phone }}">
                        </div>
                        <div class="mb-4">
                            <label for="address" class="form-label">Địa chỉ</label>
                            <textarea class="form-control" id="address" name="address" rows="3">{{ user.address }}</textarea>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-lg" style="background: var(--primary-red); color: white;">
                                <i class="fas fa-save me-2"></i>Cập Nhật
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .form-control:focus {
        border-color: var(--primary-orange);
        box-shadow: 0 0 0 0.25rem rgba(255, 160, 0, 0.25);
    }
    
    .form-control[readonly] {
        background-color: #f8f9fa;
    }
</style>
{% endblock %}
